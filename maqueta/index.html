<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VBP Niort · Accueil</title>
<meta name="robots" content="noindex">
<link rel="icon" href="img/logo-vbpn.png">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,800&amp;family=Open+Sans:wght@400;600;700&amp;family=Space+Grotesk:wght@500;700&amp;display=swap">
<style>
body{margin:0;background:#ffffff}
a{color:#1c5fa6}a:hover{color:#1b4180}
.wrap{box-sizing:border-box;width:100%;max-width:1280px;margin:0 auto;padding-left:24px;padding-right:24px}
@media (min-width:1440px){.wrap{max-width:1400px;padding-left:32px;padding-right:32px}}
@media (min-width:1680px){.wrap{max-width:1600px}}
:focus-visible{outline:2px solid #1c5fa6;outline-offset:2px}
.dark :focus-visible{outline-color:#ffc21a}
.score{font-family:'Archivo','Helvetica Neue',Arial,sans-serif;font-stretch:125%;font-weight:800;font-variant-numeric:tabular-nums}
.btn{transition:background-color .2s,border-color .2s,color .2s}
.btn-cta:hover{background:#ffd24d !important}
.btn-ghost-dark:hover{background:rgba(255,255,255,.12) !important}
.btn-ghost:hover{background:#eaf3fa !important}
.card{transition:border-color .25s}
.card:hover{border-color:#5a82aa !important}
.card img{transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.card:hover img{transform:scale(1.04)}
.sponsor{transition:border-color .25s}
.sponsor img{filter:grayscale(1);opacity:.7;transition:filter .3s,opacity .3s}
.sponsor:hover{border-color:#5a82aa !important}
.sponsor:hover img,.sponsor:focus-visible img{filter:none;opacity:1}
.thumb{transition:opacity .3s}
.thumb:hover{opacity:1 !important}
.slide{transition:opacity .7s ease,transform .9s cubic-bezier(.2,.7,.2,1)}
@keyframes vbpProgress{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes vbpPulse{0%,100%{opacity:1}50%{opacity:.35}}
.pulse{animation:vbpPulse 1.6s ease-in-out infinite}
.los{display:inline-block;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.mm-btn{transition:color .2s}
.mm-btn:hover{color:#1c5fa6 !important}
.mm-btn svg{transition:transform .25s}
.mm-col{transition:opacity .3s,filter .3s}
.mm-col.dim,.mm-grid:hover .mm-col,.mm-grid:focus-within .mm-col{opacity:.36;filter:blur(1.4px) saturate(.5)}
.mm-grid .mm-col:hover,.mm-grid .mm-col:focus-within{opacity:1 !important;filter:none !important}
.mm-lien{transition:background-color .2s}
.mm-lien:hover{background:#eaf3fa}
.mm-lien:hover .mm-t{color:#1c5fa6}
@keyframes mmIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.mm-panel{animation:mmIn .28s cubic-bezier(.2,.7,.2,1)}
.nav-m{display:none !important}
.nav-d{flex-wrap:nowrap !important;white-space:nowrap}
@media (max-width:1360px){.nav-d{gap:20px !important;font-size:15px !important}.h-boutique{display:none !important}}
@media (max-width:1200px){.h-ffv{display:none !important}.nav-d{gap:16px !important}.nav-d svg{display:none}}
@media (max-width:1080px){.nav-d,#mega-menu,.mm-voile{display:none !important}.only-m.nav-m{display:flex !important}}
@media (min-width:761px) and (max-width:1080px){.only-m.nav-m{margin-left:0 !important}}
.only-m{display:none !important}
@media (max-width:760px){
.only-d{display:none !important}
.only-m{display:flex !important}
.hero-stage{min-height:0 !important}
.hero-photo{position:relative !important;width:100% !important;height:240px !important;clip-path:none !important}
.hero-copy{padding-top:24px !important;padding-bottom:8px !important;max-width:none !important}
.hero-h1{font-size:34px !important;line-height:1.05 !important}
.hero-p{font-size:17px !important}
.big-h2{font-size:34px !important}
.stat-n{font-size:40px !important}
}
@media (prefers-reduced-motion:reduce){
*{animation:none !important;transition:none !important}
}
</style>

<style>
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:100;max-width:calc(100% - 32px);padding:14px 20px;border-radius:12px;background:#0b1b33;color:#fff;font:600 15px/22px 'Open Sans',Arial,sans-serif;transition:opacity .25s,transform .25s}
#toast.on{opacity:1;transform:translate(-50%,0)}
.maq-tag{position:fixed;right:12px;bottom:12px;z-index:90;padding:6px 10px;border-radius:8px;background:rgba(11,27,51,.85);color:#fff;font:600 12px/16px 'Open Sans',Arial,sans-serif;letter-spacing:.04em}
</style>
</head>
<body>
<template id="dc-tpl">
<div style="background: #ffffff; color: #0b1b33; font-family: 'Open Sans', 'Segoe UI', Arial, sans-serif; font-size: 17px; line-height: 27px">

<!-- EN-TÊTE -->
<header style="position: relative; z-index: 60; background: #ffffff; border-bottom: 1px solid #d3e1ee">
<div class="wrap" style="padding-top: 12px; padding-bottom: 12px; display: flex; flex-wrap: nowrap; gap: 12px 28px; align-items: center">
<span style="display: flex; align-items: center; gap: 16px; flex: 0 0 auto">
<a href="index.html" aria-label="VBP Niort, accueil" style="display: flex"><img src="img/logo-vbpn.png" alt="VBP Niort, accueil" style="width: 72px; height: 72px; display: block"></a>
<template data-sc="if" value="{{apercu}}" hint-placeholder-val="{{true}}">
<a href="#" class="only-d h-ffv" title="Club affilié à la Fédération française de volley" style="display: flex; align-items: center; gap: 16px; text-decoration: none"><span aria-hidden="true" style="width: 1px; height: 44px; background: #d3e1ee"></span><img src="img/ffvolley.svg" alt="Club affilié à la FFVolley" style="width: 46px; height: auto; display: block"></a>
</template>
</span>
<template data-sc="if" value="{{apercu}}" hint-placeholder-val="{{true}}">
<nav class="only-d nav-d" aria-label="Menu principal" style="display: flex; flex-wrap: wrap; gap: 4px 26px; flex: 1 1 auto; min-width: 0; align-self: stretch; font-family: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif; font-weight: 500; font-size: 16px">
<template data-sc="for" list="{{mmNav}}" as="n" hint-placeholder-count="6">
<button type="button" class="mm-btn" aria-expanded="{{n.expanded}}" aria-controls="mega-menu" onClick="{{n.pick}}" style="{{n.style}}">{{n.label}}<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true" style="{{n.chev}}"><path d="M2.5 4.5L6 8l3.5-3.5"/></svg></button>
</template>
</nav>
</template>
<div class="only-d h-cta" style="display: flex; gap: 20px; align-items: center; margin-left: auto">
<a href="#" class="h-boutique" style="font-size: 15px; color: #4f5f77; text-decoration: none; font-weight: 600">Boutique</a>
<a href="licences.html" class="btn btn-cta" style="display: inline-flex; align-items: center; min-height: 48px; padding: 0 22px; background: #ffc21a; color: #0b1b33; border-radius: 8px; text-decoration: none; font-weight: 700; font-size: 16px">Se licencier</a>
</div>
<button type="button" class="only-m nav-m" aria-expanded="{{menuOpen}}" aria-controls="menu-mobile" onClick="{{toggleMenu}}" style="margin-left: auto; align-items: center; gap: 10px; min-height: 44px; padding: 0 14px; border: 1px solid #5a82aa; border-radius: 8px; background: #ffffff; color: #0b1b33; font: inherit; font-weight: 700; font-size: 15px; cursor: pointer">
<span style="display: flex; flex-direction: column; gap: 4px"><span style="width: 18px; height: 2px; background: #0b1b33"></span><span style="width: 18px; height: 2px; background: #0b1b33"></span><span style="width: 18px; height: 2px; background: #0b1b33"></span></span>{{menuLabel}}</button>
</div>
<template data-sc="if" value="{{menuOpen}}" hint-placeholder-val="{{false}}">
<nav id="menu-mobile" aria-label="Menu principal" style="border-top: 1px solid #d3e1ee">
<div class="wrap" style="padding-top: 4px; padding-bottom: 24px; display: flex; flex-direction: column; font-family: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif">
<a href="histoire.html" style="display: flex; align-items: center; min-height: 56px; border-bottom: 1px solid #d3e1ee; color: #0b1b33; font-size: 22px; font-weight: 700; text-decoration: none">Le club</a>
<a href="equipe.html" style="display: flex; align-items: center; min-height: 56px; border-bottom: 1px solid #d3e1ee; color: #0b1b33; font-size: 22px; font-weight: 700; text-decoration: none">Équipes</a>
<a href="calendrier.html" style="display: flex; align-items: center; min-height: 56px; border-bottom: 1px solid #d3e1ee; color: #0b1b33; font-size: 22px; font-weight: 700; text-decoration: none">Calendrier &amp; résultats</a>
<a href="#formation" style="display: flex; align-items: center; min-height: 56px; border-bottom: 1px solid #d3e1ee; color: #0b1b33; font-size: 22px; font-weight: 700; text-decoration: none">Formation</a>
<a href="#ages" style="display: flex; align-items: center; min-height: 56px; border-bottom: 1px solid #d3e1ee; color: #0b1b33; font-size: 22px; font-weight: 700; text-decoration: none">Volley pour tous</a>
<a href="#actus" style="display: flex; align-items: center; min-height: 56px; border-bottom: 1px solid #d3e1ee; color: #0b1b33; font-size: 22px; font-weight: 700; text-decoration: none">Actus</a>
<a href="#" style="display: flex; align-items: center; min-height: 56px; border-bottom: 1px solid #d3e1ee; color: #0b1b33; font-size: 22px; font-weight: 700; text-decoration: none">Partenaires</a>
<a href="#" style="display: flex; align-items: center; min-height: 52px; color: #4f5f77; font-family: 'Open Sans', sans-serif; font-size: 16px; font-weight: 600; text-decoration: none">Boutique</a>
<a href="licences.html" class="btn btn-cta" style="margin-top: 8px; display: flex; align-items: center; justify-content: center; min-height: 52px; background: #ffc21a; color: #0b1b33; border-radius: 8px; text-decoration: none; font-family: 'Open Sans', sans-serif; font-weight: 700">Se licencier</a>
</div>
</nav>
</template>
<template data-sc="if" value="{{mmOuvert}}" hint-placeholder-val="{{true}}">
<div class="only-d mm-voile" aria-hidden="true" onClick="{{mmFermer}}" style="position: absolute; left: 0; right: 0; top: 100%; height: 1400px; background: rgba(11,27,51,.55)"></div>
<div id="mega-menu" class="only-d mm-panel" style="position: absolute; left: 0; right: 0; top: 100%; background: #ffffff; border-bottom: 1px solid #d3e1ee">
<div class="wrap" style="padding-top: 36px; padding-bottom: 32px">
<div role="list" class="mm-grid" style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 28px">
<template data-sc="for" list="{{mmCols}}" as="c" hint-placeholder-count="6">
<div role="listitem" class="{{c.cls}}">
<div style="display: flex; align-items: center; gap: 8px; padding-bottom: 12px; margin-bottom: 6px; border-bottom: 2px solid {{c.trait}}; font-size: 12px; line-height: 16px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: {{c.couleur}}"><span class="los" style="width: 16px; height: 9px; background: {{c.couleur}}"></span>{{c.label}}</div>
<ul style="list-style: none; margin: 0; padding: 0">
<template data-sc="for" list="{{c.liens}}" as="l" hint-placeholder-count="5">
<li><a href="{{l.href}}" onClick="{{mmFermer}}" class="mm-lien" style="display: block; padding: 10px 12px; margin: 0 -12px; border-radius: 10px; text-decoration: none"><span class="mm-t" style="display: flex; align-items: center; gap: 8px; color: #0b1b33; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 16px; line-height: 22px"><span style="{{l.dot}}"></span>{{l.t}}</span><span style="display: block; margin-top: 2px; color: #4f5f77; font-size: 13px; line-height: 19px">{{l.d}}</span></a></li>
</template>
</ul>
</div>
</template>
</div>
</div>
<div class="dark" style="position: relative; background: #0b1b33; color: #ffffff; overflow: hidden">
<img src="img/patron-triangulos.jpg" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover"><div aria-hidden="true" style="position: absolute; inset: 0; background: linear-gradient(100deg, rgba(11,27,51,.88) 0%, rgba(11,27,51,.66) 60%, rgba(11,27,51,.5) 100%)"></div>
<div class="wrap" style="position: relative; padding-top: 18px; padding-bottom: 18px; display: flex; flex-wrap: wrap; gap: 14px 32px; align-items: center">
<span style="display: flex; align-items: center; gap: 14px"><span style="display: flex; padding: 6px; background: #ffffff; border-radius: 8px"><img src="img/ffvolley.svg" alt="" style="width: 34px; height: auto; display: block"></span><span style="font-size: 14px; line-height: 20px; color: #c9d6e6"><strong style="color: #ffffff">Club affilié FFVolley</strong><br>Club formateur labellisé · [année]</span></span>
<span style="font-size: 14px; line-height: 20px; color: #c9d6e6">Complexe Henri Barbusse · Gymnase de Sainte-Pezenne</span>
<span style="margin-left: auto; display: flex; gap: 12px; align-items: center">
<a href="#" style="color: #7cc4ec; font-weight: 600; font-size: 15px; text-decoration: none">Nous contacter</a>
<a href="licences.html" class="btn btn-cta" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 20px; background: #ffc21a; color: #0b1b33; border-radius: 8px; text-decoration: none; font-weight: 700; font-size: 15px">Essayer gratuitement</a>
</span>
</div>
</div>
</div>
</template>
</header>

<!-- PORTADA -->
<section class="dark" aria-roledescription="carrousel" aria-label="À la une" style="position: relative; background: #0b1b33; color: #ffffff; overflow: hidden">
<img src="img/patron-triangulos.jpg" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.12">
<div class="hero-stage" style="position: relative; display: grid; min-height: 600px">
<template data-sc="for" list="{{slides}}" as="sl" hint-placeholder-count="5">
<div class="slide" aria-hidden="{{sl.hidden}}" style="{{sl.layer}}">
<div class="hero-photo" style="position: absolute; top: 0; right: 0; bottom: 0; width: 58%; clip-path: polygon(14% 0, 100% 0, 100% 100%, 0 100%); overflow: hidden; background: #1b4180">
<img src="{{sl.photo}}" alt="{{sl.alt}}" style="width: 100%; height: 100%; object-fit: cover; object-position: {{sl.pos}}; display: block">
</div>
<div class="wrap" style="position: relative">
<div class="hero-copy" style="max-width: 600px; padding-top: 112px; padding-bottom: 64px; display: flex; flex-direction: column; gap: 20px">
<span style="font-size: 13px; line-height: 16px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #7cc4ec">{{sl.kicker}}</span>
<h1 class="hero-h1" style="{{sl.h1}}">{{sl.titre}}</h1>
<p class="hero-p" style="margin: 0; font-size: 20px; line-height: 30px; color: #c9d6e6; max-width: 520px">{{sl.texte}}</p>
<div style="display: flex; flex-wrap: wrap; gap: 12px; padding-top: 8px">
<a href="{{sl.href}}" class="btn" style="display: inline-flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 24px; background: #ffffff; color: #0b1b33; border-radius: 8px; text-decoration: none; font-weight: 700">{{sl.cta}}<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 8h10M9 4l4 4-4 4"></path></svg></a>
</div>
</div>
</div>
</div>
</template>
</div>

<div style="position: relative; background: rgba(11,27,51,.92); border-top: 1px solid rgba(124,196,236,.18)">
<div class="wrap" style="padding-top: 16px; padding-bottom: 20px">
<div role="tablist" aria-label="Diapositives" class="only-d" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 20px">
<template data-sc="for" list="{{thumbs}}" as="t" hint-placeholder-count="5">
<button type="button" role="tab" class="thumb" aria-selected="{{t.selected}}" onClick="{{t.pick}}" onMouseEnter="{{t.enter}}" onMouseLeave="{{t.leave}}" style="{{t.style}}">
<span style="display: block; height: 3px; background: rgba(255,255,255,.18); border-radius: 2px; overflow: hidden"><span style="{{t.bar}}"></span></span>
<span style="display: flex; gap: 12px; align-items: center; padding-top: 12px">
<img src="{{t.photo}}" alt="" style="flex: 0 0 64px; width: 64px; height: 48px; object-fit: cover; border-radius: 6px; display: block">
<span style="display: flex; flex-direction: column; text-align: left; min-width: 0">
<span style="font-size: 11px; line-height: 14px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #7cc4ec">{{t.label}}</span>
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 15px; line-height: 20px; font-weight: 500; color: #ffffff">{{t.titre}}</span>
</span>
</span>
</button>
</template>
</div>
<div role="tablist" aria-label="Diapositives" class="only-m" style="align-items: center; gap: 4px">
<template data-sc="for" list="{{thumbs}}" as="t" hint-placeholder-count="5">
<button type="button" role="tab" aria-selected="{{t.selected}}" aria-label="{{t.label}}" onClick="{{t.pick}}" style="{{t.dot}}"><span style="{{t.dotFill}}"></span></button>
</template>
<span style="margin-left: 10px; font-size: 13px; font-weight: 600; color: #c9d6e6">{{slideNum}} / 5 · {{slideLabel}}</span>
</div>
</div>
</div>
</section>

<!-- LES MATCHS DU WEEK-END -->
<section id="matchs" style="background: #eaf3fa; padding: 72px 0">
<div class="wrap">
<div style="display: flex; flex-wrap: wrap; gap: 16px 24px; align-items: flex-end; justify-content: space-between">
<div>
<div style="font-size: 12px; line-height: 16px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #1c5fa6">Saison 2026-2027</div>
<h2 class="big-h2" style="margin: 6px 0 0; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 44px; line-height: 1.05">Les matchs du week-end</h2>
</div>
<div style="display: flex; align-items: center; gap: 8px">
<button type="button" class="btn btn-ghost" aria-label="Week-end précédent" style="width: 44px; height: 44px; border: 1px solid #5a82aa; border-radius: 8px; background: #ffffff; color: #0b1b33; cursor: pointer; display: inline-flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M10 3L5 8l5 5"></path></svg></button>
<span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; min-width: 200px; text-align: center">Sam. 10 – dim. 11 oct.</span>
<button type="button" class="btn btn-ghost" aria-label="Week-end suivant" style="width: 44px; height: 44px; border: 1px solid #5a82aa; border-radius: 8px; background: #ffffff; color: #0b1b33; cursor: pointer; display: inline-flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 3l5 5-5 5"></path></svg></button>
</div>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; justify-content: space-between; margin: 28px 0 24px">
<div role="tablist" aria-label="État des matchs" style="display: flex; gap: 4px; padding: 4px; background: #ffffff; border: 1px solid #d3e1ee; border-radius: 10px; overflow-x: auto">
<template data-sc="for" list="{{tabs}}" as="t" hint-placeholder-count="3">
<button type="button" role="tab" aria-selected="{{t.selected}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button>
</template>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<template data-sc="for" list="{{cats}}" as="c" hint-placeholder-count="4">
<button type="button" aria-pressed="{{c.selected}}" onClick="{{c.pick}}" style="{{c.style}}"><span style="{{c.dot}}"></span>{{c.label}}</button>
</template>
</div>
</div>

<template data-sc="if" value="{{isVenir}}" hint-placeholder-val="{{true}}">
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 560px), 1fr)); gap: 16px">
<template data-sc="for" list="{{venir}}" as="m" hint-placeholder-count="4">
<article class="card" style="display: flex; flex-wrap: wrap; gap: 20px; align-items: center; padding: 20px; background: #ffffff; border: 1px solid #d3e1ee; border-radius: 20px">
<div style="{{m.dateStyle}}">
<span style="font-size: 12px; line-height: 16px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase">{{m.jour}}</span>
<span class="score" style="font-size: 34px; line-height: 36px">{{m.num}}</span>
<span style="font-size: 13px; line-height: 16px; font-weight: 600">{{m.mois}}</span>
</div>
<div style="flex: 1 1 280px; min-width: 0; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 14px; line-height: 20px">
<span style="{{m.chipStyle}}">{{m.branche}}</span>
<span style="font-weight: 600">{{m.equipe}}</span>
<span style="color: #4f5f77">{{m.comp}}</span>
</div>
<div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 17px">
<span style="display: flex; align-items: center; gap: 10px"><span style="{{m.crestA}}"><img src="{{m.imgA}}" alt="" style="{{m.imgAStyle}}">{{m.monoA}}</span>{{m.dom}}</span>
<span style="padding: 2px 10px; background: #eef3f8; color: #4f5f77; border-radius: 9999px; font-family: 'Open Sans', sans-serif; font-size: 12px; font-weight: 600">vs</span>
<span style="display: flex; align-items: center; gap: 10px"><span style="{{m.crestB}}"><img src="{{m.imgB}}" alt="" style="{{m.imgBStyle}}">{{m.monoB}}</span>{{m.ext}}</span>
</div>
